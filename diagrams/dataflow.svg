<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#334"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#fbfbfd"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#223">Потоки данных (§2.2, ТЗ 2.0)</text>

  <!-- lane labels -->
  <text x="60" y="70" font-size="13" font-weight="bold" fill="#1d3f66">Текстовый ответ</text>
  <text x="60" y="200" font-size="13" font-weight="bold" fill="#1d3f66">Голосовой ответ</text>
  <text x="60" y="360" font-size="13" font-weight="bold" fill="#1d3f66">Отчёт</text>
  <text x="60" y="480" font-size="13" font-weight="bold" fill="#1d3f66">Удаление / истечение</text>

  <!-- flow 1: text answer -->
  <g font-size="11" fill="#334">
    <rect x="60" y="84" width="150" height="52" rx="8" fill="#e3f0ff" stroke="#3a6ea5"/>
    <text x="135" y="106" text-anchor="middle">update: reply на вопрос</text>
    <text x="135" y="122" text-anchor="middle">webhook → inbox (200)</text>

    <rect x="250" y="84" width="170" height="52" rx="8" fill="#fff4e0" stroke="#c8862a"/>
    <text x="335" y="106" text-anchor="middle">inbox-worker: владелец,</text>
    <text x="335" y="122" text-anchor="middle">версия, reply → ответ + job</text>

    <rect x="460" y="84" width="160" height="52" rx="8" fill="#fff4e0" stroke="#c8862a"/>
    <text x="540" y="106" text-anchor="middle">jobs-worker: assess</text>
    <text x="540" y="122" text-anchor="middle">резерв → LLM ≤2 → settle</text>

    <rect x="660" y="84" width="150" height="52" rx="8" fill="#fff4e0" stroke="#c8862a"/>
    <text x="735" y="106" text-anchor="middle">валидация оценки,</text>
    <text x="735" y="122" text-anchor="middle">правило перехода §3.3</text>

    <rect x="850" y="84" width="120" height="52" rx="8" fill="#e9f9ee" stroke="#2e8b57"/>
    <text x="910" y="106" text-anchor="middle">outbox: ack,</text>
    <text x="910" y="122" text-anchor="middle">след. вопрос</text>

    <line x1="210" y1="110" x2="248" y2="110" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="420" y1="110" x2="458" y2="110" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="620" y1="110" x2="658" y2="110" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="810" y1="110" x2="848" y2="110" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
  </g>

  <!-- flow 2: voice -->
  <g font-size="11" fill="#334">
    <rect x="60" y="214" width="150" height="66" rx="8" fill="#e3f0ff" stroke="#3a6ea5"/>
    <text x="135" y="236" text-anchor="middle">voice: метаданные</text>
    <text x="135" y="252" text-anchor="middle">≤120 с / 10 MiB →</text>
    <text x="135" y="268" text-anchor="middle">getFile (поток ограничен)</text>

    <rect x="250" y="214" width="170" height="66" rx="8" fill="#fff4e0" stroke="#c8862a"/>
    <text x="335" y="236" text-anchor="middle">probe: OGG/Opus, granule</text>
    <text x="335" y="252" text-anchor="middle">(изолированный процесс,</text>
    <text x="335" y="268" text-anchor="middle">RLIMIT 256 MiB / 10 с)</text>

    <rect x="460" y="214" width="160" height="66" rx="8" fill="#fff4e0" stroke="#c8862a"/>
    <text x="540" y="236" text-anchor="middle">transcribe: STT ≤2,</text>
    <text x="540" y="252" text-anchor="middle">≤3 запуска/вопрос;</text>
    <text x="540" y="268" text-anchor="middle">draft + version</text>

    <rect x="660" y="214" width="150" height="66" rx="8" fill="#e9f9ee" stroke="#2e8b57"/>
    <text x="735" y="236" text-anchor="middle">экран подтверждения:</text>
    <text x="735" y="252" text-anchor="middle">подтвердить / исправить</text>
    <text x="735" y="268" text-anchor="middle">/ заново / пропустить</text>

    <rect x="850" y="214" width="120" height="66" rx="8" fill="#fff4e0" stroke="#c8862a"/>
    <text x="910" y="236" text-anchor="middle">confirm →</text>
    <text x="910" y="252" text-anchor="middle">тот же поток,</text>
    <text x="910" y="268" text-anchor="middle">что и текст</text>

    <line x1="210" y1="247" x2="248" y2="247" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="420" y1="247" x2="458" y2="247" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="620" y1="247" x2="658" y2="247" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="810" y1="247" x2="848" y2="247" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <text x="250" y="300" font-size="10" fill="#567">аудио удаляется: finally → sweep 5 мин → startup cleanup (≤1 ч); TTS вопроса — после доставки текста, сбой не блокирует</text>
  </g>

  <!-- flow 3: report -->
  <g font-size="11" fill="#334">
    <rect x="60" y="374" width="150" height="52" rx="8" fill="#e3f0ff" stroke="#3a6ea5"/>
    <text x="135" y="396" text-anchor="middle">«Завершить» либо</text>
    <text x="135" y="412" text-anchor="middle">конец плана (6 тем)</text>

    <rect x="250" y="374" width="170" height="52" rx="8" fill="#fff4e0" stroke="#c8862a"/>
    <text x="335" y="396" text-anchor="middle">snapshot (без TG-ID) →</text>
    <text x="335" y="412" text-anchor="middle">report job (резерв 24k/7k)</text>

    <rect x="460" y="374" width="160" height="52" rx="8" fill="#fff4e0" stroke="#c8862a"/>
    <text x="540" y="396" text-anchor="middle">LLM ≤2 → FeedbackReport</text>
    <text x="540" y="412" text-anchor="middle">цитаты буквально из ответов</text>

    <rect x="660" y="374" width="150" height="52" rx="8" fill="#e8eef7" stroke="#3a5ea5"/>
    <text x="735" y="396" text-anchor="middle">save + 1–4 части outbox</text>
    <text x="735" y="412" text-anchor="middle">одной транзакцией</text>

    <rect x="850" y="374" width="120" height="52" rx="8" fill="#e9f9ee" stroke="#2e8b57"/>
    <text x="910" y="396" text-anchor="middle">доставка seq →</text>
    <text x="910" y="412" text-anchor="middle">completed +</text>

    <line x1="210" y1="400" x2="248" y2="400" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="420" y1="400" x2="458" y2="400" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="620" y1="400" x2="658" y2="400" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="810" y1="400" x2="848" y2="400" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <text x="850" y="444" font-size="10" fill="#567">credit consumed</text>
    <text x="250" y="444" font-size="10" fill="#567">невалидно/переполнение → детерминированный отчёт (degraded); delivery_started_at → отмена BUSY; /report — повтор без LLM</text>
  </g>

  <!-- flow 4: deletion -->
  <g font-size="11" fill="#334">
    <rect x="60" y="494" width="180" height="66" rx="8" fill="#e3f0ff" stroke="#3a6ea5"/>
    <text x="150" y="516" text-anchor="middle">/delete (подтверждение) →</text>
    <text x="150" y="532" text-anchor="middle">блокировка действий,</text>
    <text x="150" y="548" text-anchor="middle">отмена очередей</text>

    <rect x="280" y="494" width="200" height="66" rx="8" fill="#fff4e0" stroke="#c8862a"/>
    <text x="380" y="516" text-anchor="middle">sweep ≤24 ч: медиа, данные,</text>
    <text x="380" y="532" text-anchor="middle">затем users; tombstone</text>
    <text x="380" y="548" text-anchor="middle">(внутренний UUID, 7 дней)</text>

    <rect x="520" y="494" width="200" height="66" rx="8" fill="#fdeaea" stroke="#b04a4a"/>
    <text x="620" y="516" text-anchor="middle">restore: трафик только после</text>
    <text x="620" y="532" text-anchor="middle">reapply_tombstones;</text>
    <text x="620" y="548" text-anchor="middle">inbox сверяется до обработки</text>

    <rect x="760" y="494" width="210" height="66" rx="8" fill="#e8eef7" stroke="#3a5ea5"/>
    <text x="865" y="516" text-anchor="middle">retention: контент 30 дней,</text>
    <text x="865" y="532" text-anchor="middle">payload 24 ч, метаданные 7 дней,</text>
    <text x="865" y="548" text-anchor="middle">события/затраты 90 дней</text>

    <line x1="240" y1="527" x2="278" y2="527" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="480" y1="527" x2="518" y2="527" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="720" y1="527" x2="758" y2="527" stroke="#334" stroke-width="2" marker-end="url(#a2)"/>
  </g>

  <text x="500" y="600" text-anchor="middle" font-size="11" fill="#567">Поздний результат AI не восстанавливает терминальные состояния: expected_version + lease_owner + статус под блокировками (§2.4)</text>
</svg>
