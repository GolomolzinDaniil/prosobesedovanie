[project]
name = "prosobesedovanie"
version = "2.0.0"
description = "Telegram-бот «ПроСобеседование»: адаптивное текстовое и голосовое интервью с персональным отчётом. Модульный монолит (FastAPI + aiogram, PostgreSQL)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM300", "RUF059"]
"scripts/make_examples.py" = ["E501"]
